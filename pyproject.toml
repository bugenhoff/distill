[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "yolo26-distill"
version = "0.1.0"
description = "YOLO26 distillation and export scripts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ultralytics>=8.3.0",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "onnx>=1.17.0",
  "onnxslim>=0.1.59",
  "openvino>=2024.4.0",
  "PySide6>=6.8.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
